name: Build RetakesAllocator.zip

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types:
      - created

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore Dependencies
        run: |
          dotnet restore RetakesAllocator/RetakesAllocator.csproj
          dotnet restore RetakesAllocatorTest/RetakesAllocatorTest.csproj
      - name: Test
        run: dotnet test RetakesAllocatorTest/RetakesAllocatorTest.csproj --no-restore -c Release
      - name: Build
        shell: bash
        run: dotnet build RetakesAllocator/RetakesAllocator.csproj --no-restore -c Release
      - name: Package
        working-directory: ${{github.workspace}}/RetakesAllocator/
        run: chmod +x release.bash; ./release.bash
      - name: Publish Archive for Branch
        uses: actions/upload-artifact@v7
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: RetakesAllocator-${{github.sha}}
          path: ${{github.workspace}}/RetakesAllocator/bin/Release/RetakesAllocator
      - name: Publish Archive for Release
        uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: RetakesAllocator-${{github.ref_name}}
          path: ${{github.workspace}}/RetakesAllocator/bin/Release/RetakesAllocator
  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v7
        name: Fetch Artifact
        with:
          name: RetakesAllocator-${{github.ref_name}}
          path: ${{github.workspace}}/RetakesAllocator/
      - name: Create Archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: zip -r "cs2-retakes-allocator-${RELEASE_TAG}.zip" RetakesAllocator
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" "cs2-retakes-allocator-${RELEASE_TAG}.zip" --repo "$GH_REPO"
